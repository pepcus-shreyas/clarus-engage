# Required repository secrets (Dev): AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
# S3_BUCKET_DEV, CLOUDFRONT_ID_DEV (optional). Optional: VITE_ENGAGE_API_HOST_DEV

name: Dev CI

on:
  push:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

  deploy:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install dependencies
        run: npm ci

      - name: Build application (development)
        run: npm run build:dev
        env:
          VITE_ENGAGE_API_HOST: ${{ secrets.VITE_ENGAGE_API_HOST_DEV }}

      - name: Deploy application to AWS
        run: npm run deploy:dev
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET_DEV }}
          CLOUDFRONT_ID: ${{ secrets.CLOUDFRONT_ID_DEV }}
